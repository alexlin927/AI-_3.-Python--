<!doctype html>
<html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="theme-color" content="#0b1c36"><title>Python 第三單元｜迴圈・元組・字典</title><style>
:root{color-scheme:dark;--bg:#08182b;--surface:#112743;--card:#172f4e;--line:#2c4768;--text:#f3f7ff;--muted:#bbcadc;--blue:#62b7ff}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--text)}button{font:inherit;cursor:pointer;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--text);padding:10px 14px}button:hover{background:#244565}button:focus-visible{outline:3px solid #7ec7ff;outline-offset:2px}.primary{background:#1763a8;border-color:#4093dc}.primary:hover{background:#277abd}.top{position:sticky;top:0;z-index:5;background:#0c2038f2;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px clamp(14px,3vw,38px);backdrop-filter:blur(12px)}.brand{font-size:clamp(15px,1.8vw,21px);font-weight:750}.sub{font-size:12px;color:var(--muted);margin-top:3px}.tools{display:flex;gap:7px;flex-wrap:wrap}.wrap{max-width:1460px;padding:22px clamp(12px,3vw,38px) 60px;margin:auto}.slide-frame{width:100%;aspect-ratio:16/9;border:1px solid #45607d;border-radius:11px;overflow:hidden;background:#fff;box-shadow:0 18px 65px #0006;display:flex;align-items:center;justify-content:center}.slide-frame img{display:block;width:100%;height:100%;object-fit:contain}.control{display:flex;gap:10px;align-items:center;justify-content:center;margin:18px 0 12px}.counter{min-width:140px;text-align:center;font-variant-numeric:tabular-nums;font-weight:650}.small{color:var(--muted);font-size:13px;text-align:center}.notes{margin:22px 0 0;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface)}.notes-head{padding:16px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line)}.notes h2{margin:0;font-size:18px}.notes-body{padding:21px 24px;white-space:pre-wrap;line-height:1.95;font-size:clamp(15px,1.4vw,18px);letter-spacing:.01em}.hidden{display:none!important}.overview{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:13px;margin-top:20px}.thumb{padding:7px;text-align:left;background:var(--surface);border-radius:10px}.thumb img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:5px;background:white;display:block}.thumb .txt{font-size:13px;padding:8px 4px 2px;white-space:nowrap;text-overflow:ellipsis;overflow:hidden}.thumb.active{outline:2px solid var(--blue)}.headrow{display:flex;justify-content:space-between;align-items:center;gap:8px}.notes-switch{background:none;border:0;padding:3px;color:var(--blue);font-size:13px}.help{margin-top:14px}.help summary{cursor:pointer;color:var(--muted)}.help p{color:var(--muted);font-size:14px;line-height:1.7}.foot{color:#94aeca;text-align:center;font-size:12px;margin-top:38px}@media(max-width:720px){.top{position:static;display:block}.tools{margin-top:12px}.wrap{padding-top:12px}.control button{padding:9px 10px}.counter{min-width:80px}.notes-body{padding:16px}.notes-head{padding:12px 16px}}
body.fullscreen .top,body.fullscreen .control,body.fullscreen .small,body.fullscreen .notes,body.fullscreen .foot,body.fullscreen .help{display:none!important}body.fullscreen .wrap{padding:0;max-width:none;width:100vw;height:100vh;display:grid;place-items:center}body.fullscreen .slide-frame{width:min(100vw,177.7778vh);height:min(100vh,56.25vw);border:0;border-radius:0;box-shadow:none}
</style></head><body>
<header class="top"><div><div class="brand">Python 入門｜第三單元：迴圈・元組・字典</div><div class="sub">國立臺灣師範大學　化學系｜44 頁 16:9 教學投影片</div></div><div class="tools"><button id="notes-btn" aria-pressed="true">隱藏講稿</button><button id="overview-btn" aria-pressed="false">頁面總覽</button><button id="full-btn">全螢幕</button></div></header>
<main class="wrap"><section id="viewer"><div class="slide-frame" id="slide-frame"><img id="current-img" alt="Python 教學投影片"/></div><div class="control"><button id="prev">← 上一頁</button><div class="counter" id="count">1 / 44</div><button id="next" class="primary">下一頁 →</button></div><div class="small" id="slide-title"></div><section class="notes" id="notes-section"><div class="notes-head"><h2>🎤 本頁教師演講稿</h2><button class="notes-switch" id="copy-note">複製講稿</button></div><div class="notes-body" id="note-text"></div></section><details class="help"><summary>操作方式</summary><p>可使用鍵盤 ← → 換頁；按 F 進入或離開全螢幕，Esc 離開全螢幕；點選「頁面總覽」可快速選頁。講稿內容來自 PowerPoint 備忘稿，學生瀏覽時可自行隱藏。</p></details></section><section id="overview" class="hidden"><div class="headrow"><h2>全部 44 頁</h2><button id="back">返回投影片</button></div><div class="overview" id="grid"></div></section><div class="foot">Python 入門教學講義｜所有內容可直接由 GitHub Pages 靜態託管</div></main>
<script src="data.js"></script><script>
(()=>{'use strict';const slides=window.SLIDES||[],N=slides.length;let current=0,showNotes=true,showOverview=false;const $=id=>document.getElementById(id);const img=$('current-img');function render(){let s=slides[current];if(!s)return;img.src=s.image;img.alt=`第 ${s.n} 頁 ${s.title}`;$('count').textContent=`${s.n} / ${N}`;$('slide-title').textContent=s.title;$('note-text').textContent=s.notes||'本頁沒有備忘稿';$('prev').disabled=current===0;$('next').disabled=current===N-1;document.title=`${s.n}/${N}｜Python 迴圈、元組與字典`;location.hash=`slide-${s.n}`;document.querySelectorAll('.thumb').forEach((b,i)=>b.classList.toggle('active',i===current));}
function go(i){current=Math.min(N-1,Math.max(0,i));render();}function notes(b){showNotes=b;$('notes-section').classList.toggle('hidden',!b);$('notes-btn').textContent=b?'隱藏講稿':'顯示講稿';$('notes-btn').setAttribute('aria-pressed',String(b));}function overview(b){showOverview=b;$('viewer').classList.toggle('hidden',b);$('overview').classList.toggle('hidden',!b);$('overview-btn').textContent=b?'返回投影片':'頁面總覽';$('overview-btn').setAttribute('aria-pressed',String(b));if(!b)render();}
$('prev').onclick=()=>go(current-1);$('next').onclick=()=>go(current+1);$('notes-btn').onclick=()=>notes(!showNotes);$('overview-btn').onclick=()=>overview(!showOverview);$('back').onclick=()=>overview(false);
$('copy-note').onclick=async()=>{let t=slides[current].notes;try{await navigator.clipboard.writeText(t);$('copy-note').textContent='已複製';setTimeout(()=>$('copy-note').textContent='複製講稿',1500);}catch(e){window.prompt('請複製講稿：',t);}};
$('full-btn').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();else $('slide-frame').requestFullscreen?.();};document.addEventListener('fullscreenchange',()=>{document.body.classList.toggle('fullscreen',!!document.fullscreenElement);$('full-btn').textContent=document.fullscreenElement?'離開全螢幕':'全螢幕';});
document.addEventListener('keydown',e=>{if(e.target.closest('input,textarea'))return;if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();if(showOverview)overview(false);go(current+1);}if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();if(showOverview)overview(false);go(current-1);}if(e.key.toLowerCase()==='f'&&!e.ctrlKey&&!e.metaKey){e.preventDefault();$('full-btn').click();}});
slides.forEach((s,i)=>{let b=document.createElement('button');b.className='thumb';b.innerHTML=`<img loading="lazy" alt="第 ${s.n} 頁" src="${s.image}"><div class="txt">${s.n}. ${s.title.replaceAll('<','&lt;').replaceAll('>','&gt;')}</div>`;b.onclick=()=>{go(i);overview(false);window.scrollTo({top:0,behavior:'smooth'});};$('grid').appendChild(b);});const hash=location.hash.match(/slide-(\d+)/);if(hash)current=Math.min(N-1,Math.max(0,+hash[1]-1));render();notes(true);})();
</script></body></html>
